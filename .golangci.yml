version: "2"

run:
  tests: true

linters:
  # The "standard" set (errcheck, govet, ineffassign, staticcheck, unused) stays
  # enabled; the linters below are added on top of it.
  enable:
    - bodyclose
    - dogsled
    - exhaustive
    - funlen
    - gochecknoinits
    - goconst
    - gocritic
    - gocyclo
    - goprintffuncname
    - misspell
    - nakedret
    - noctx
    - nolintlint
    - revive
    - rowserrcheck
    - unconvert
    - unparam
    - whitespace

  settings:
    exhaustive:
      default-signifies-exhaustive: true
    funlen:
      lines: 256
      statements: 120
    gocritic:
      disabled-checks:
        - exitAfterDefer
    goconst:
      min-len: 5
      min-occurrences: 4
    nolintlint:
      require-explanation: true
      require-specific: true
      allow-unused: false
    revive:
      rules:
        - name: defer
        - name: deep-exit
        - name: duplicated-imports
        - name: empty-lines
        - name: enforce-map-style
        - name: error-naming
        - name: error-return
        - name: errorf
        - name: exported
        - name: import-shadowing
        - name: range
        - name: struct-tag
        - name: time-naming
        - name: unexported-return
        - name: unhandled-error
          arguments:
            # Printing to stdout in examples and tests.
            - 'fmt\.Print.*'
        - name: unnecessary-stmt
        - name: unreachable-code
        - name: useless-break
        - name: var-declaration
        - name: var-naming

  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    rules:
      # aws-sdk-go v1 is deprecated upstream. Moving azsqs to aws-sdk-go-v2 is a
      # separate change; until then, don't fail lint on its deprecation notices.
      - path: ^azsqs(/|_test\.go$)
        linters:
          - staticcheck
        text: 'SA1019: .*github\.com/aws/aws-sdk-go'
      # Tests repeat literal fixtures such as "hello" and "world" on purpose.
      - path: _test\.go$
        linters:
          - goconst

formatters:
  enable:
    - gofmt
    - goimports
  exclusions:
    generated: lax
