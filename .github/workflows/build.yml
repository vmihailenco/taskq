name: Go

on:
  push:
    branches: [v5]
  pull_request:
    branches: [v5]

permissions:
  contents: read

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        go-version: ['1.25.x', '1.26.x', '1.27.x']

    services:
      redis:
        image: redis
        options: >-
          --health-cmd "redis-cli ping" --health-interval 10s --health-timeout 5s --health-retries 5
        ports:
          - 6379:6379

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up ${{ matrix.go-version }}
        uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go-version }}

      - name: Test
        run: make test
        env:
          # go.mod pins `toolchain go1.27.4`; without this, Go would switch every
          # matrix entry to 1.27.4 and the older versions would never be tested.
          GOTOOLCHAIN: local
